<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Technocybber | Elite Hardware Store</title>

<!-- SDK MERCADO PAGO -->
<script src="https://sdk.mercadopago.com/js/v2"></script>

<!-- ✅ REMOVIDO script errado -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ✅ SEU HTML VISUAL CONTINUA IGUAL (não alterei layout) -->

<!-- SCRIPT PRINCIPAL -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

<script>
    // ✅ 🔒 USAR SOMENTE PUBLIC KEY (NUNCA ACCESS TOKEN)
    const mp = new MercadoPago('SUA_PUBLIC_KEY_AQUI');

    let v_atual = 0;
    let p_atual = "";

    function abrirModalEmail(valor, produto) {
        v_atual = valor;
        p_atual = produto;

        document.getElementById('payment-modal').style.display = 'block';
        document.getElementById('email-step').style.display = 'block';
        document.getElementById('paymentBrick_container').innerHTML = ''; 
    }

    function fecharModal() {
        document.getElementById('payment-modal').style.display = 'none';
        if (window.paymentBrickController) window.paymentBrickController.unmount();
    }

    async function validarEProcessar() {
        const email = document.getElementById('input-email-cliente').value;

        // ✅ VALIDAÇÃO MELHORADA
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!valid) {
            alert("Digite um e-mail válido.");
            return;
        }

        document.getElementById('email-step').style.display = 'none';

        const bricksBuilder = mp.bricks();

        const settings = {
            initialization: {
                amount: v_atual,
                payer: { email }
            },
            customization: {
                paymentMethods: {
                    ticket: "all",
                    bankTransfer: "all",
                    creditCard: "all"
                }
            },
            callbacks: {
                onReady: () => console.log("MP Pronto"),

                onError: (error) => {
                    console.error(error);
                    alert("Erro ao carregar pagamento.");
                },

                onSubmit: ({ formData }) => {
                    return new Promise((resolve, reject) => {

                        fetch("/api/finalizar", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                ...formData,
                                produto: p_atual,
                                valor: v_atual
                            })
                        })

                        .then(res => {
                            if (!res.ok) throw new Error();
                            return res.json();
                        })

                        .then(res => {
                            if (res.status === 'approved') {
                                alert("✅ Pagamento aprovado!");
                            } else if (res.status === 'pending' || res.status === 'in_process') {
                                alert("⏳ Pagamento em processamento.");
                            } else {
                                alert("❌ Pagamento recusado.");
                            }
                            resolve();
                        })

                        .catch(() => {
                            alert("Erro no servidor.");
                            reject();
                        });
                    });
                }
            }
        };

        window.paymentBrickController = await bricksBuilder.create(
            'payment',
            'paymentBrick_container',
            settings
        );
    }

    flatpickr("#data", {
        enableTime: true,
        dateFormat: "d/m/Y H:i",
        minDate: "today",
        locale: "pt"
    });

    function enviar() {
        const nome = document.getElementById('nome').value;
        const endereco = document.getElementById('endereco').value;
        const tipo = document.getElementById('tipo_solicitacao').value;
        const data = document.getElementById('data').value;
        const descricao = document.getElementById('descricao').value;

        if (!nome || !endereco || !tipo || !data || !descricao) {
            alert("Preencha todos os campos.");
            return;
        }

        const msg = `*SOLICITAÇÃO TECHNOCYBBER*%0A*Cliente:* ${nome}%0A*Endereço:* ${endereco}%0A*Tipo:* ${tipo}%0A*Data:* ${data}%0A*Descrição:* ${descricao}`;

        window.open(`https://wa.me/5511986756309?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
