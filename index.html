<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technocybber | Elite Hardware Store</title>
    
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --accent: #00f2ff; 
            --border: rgba(0, 242, 255, 0.2);
            --card-glass: rgba(10, 10, 20, 0.90);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(0,8,15,0.8), rgba(0,8,15,0.8)), url('https://www.meupositivo.com.br/doseujeito/wp-content/uploads/2025/06/chip-ia-hardware.webp');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; overflow-x: hidden;
        }

        /* --- CABEÇALHO FORMATO IMAGEM --- */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            padding: 0 15px;
            background: #000; /* Fundo preto sólido como na imagem */
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 1000; border-bottom: 1px solid var(--border);
        }

        /* Bloco da Esquerda (Logo + Textos) */
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            filter: drop-shadow(0 0 8px var(--accent));
            object-fit: cover;
        }

        /* Container do Nome e do Menu */
        .brand-info {
            display: flex;
            flex-direction: column; /* Faz ficar um embaixo do outro */
            justify-content: center;
        }

        .logo-text { 
            font-family: 'Syncopate', sans-serif; 
            color: #fff; 
            font-size: 0.9rem; 
            font-weight: 700; 
            letter-spacing: 1px;
            line-height: 1.2;
        }

        nav { 
            display: flex; 
            gap: 10px; 
            margin-top: 4px;
        }
        
        nav a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase;
        }

        /* Botão do Carrinho na Direita */
        .cart-icon-btn {
            background: none; border: none; color: var(--accent); 
            cursor: pointer; position: relative; font-size: 1.2rem;
        }
        #cart-count {
            position: absolute; top: -8px; right: -8px; background: #ff0055; color: #fff;
            font-size: 0.6rem; width: 16px; height: 16px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        /* Ajuste para telas maiores */
        @media (min-width: 768px) {
            .logo-text { font-size: 1.2rem; }
            nav { gap: 20px; }
            nav a { font-size: 0.8rem; }
        }

        /* --- RESTO DO SITE --- */
        section { padding: 120px 20px 40px; display: flex; flex-direction: column; align-items: center; }
        .section-title { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; margin-bottom: 40px; color: var(--accent); text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .card { background: var(--card-glass); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .product-img { width: 100%; height: 180px; object-fit: contain; background: #fff; border-radius: 5px; margin-bottom: 15px; padding: 10px; }
        .price { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin: 10px 0; display: block; }
        .btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; cursor: pointer; font-size: 0.7rem; }
        .btn:hover { background: var(--accent); color: #000; }

        #cart-sidebar {
            position: fixed; right: -100%; top: 0; width: 100%; max-width: 350px; height: 100%;
            background: #050505; border-left: 1px solid var(--accent); z-index: 2001;
            transition: 0.4s; padding: 25px; display: flex; flex-direction: column;
        }
        #cart-sidebar.active { right: 0; }
        .cart-items-list { flex-grow: 1; overflow-y: auto; margin-top: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; font-size: 0.8rem; }
        .remove-btn { color: #ff4444; background: none; border: none; cursor: pointer; }

        #payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; padding: 20px; overflow-y: auto; }
        .payment-content { max-width: 450px; margin: 0 auto; background: #050505; border: 1px solid var(--accent); padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <!-- LOGO IMAGEM -->
            <img src="https://i.gifer.com/origin/c9/c97052cf6ec794a3c11e7ecc88f7fe52_w200.gif" alt="Logo" class="logo-img">
            
            <!-- BLOCO DE TEXTO AO LADO DO LOGO -->
            <div class="brand-info">
                <div class="logo-text">TECHNOCYBBER</div>
                <nav>
                    <a href="#home">HOME</a>
                    <a href="#loja">LOJA</a>
                    <a href="#servicos">SERVIÇOS</a>
                    <a href="#contato">CONTATO</a>
                </nav>
            </div>
        </div>

        <!-- CARRINHO NA DIREITA -->
        <button class="cart-icon-btn" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </button>
    </header>

    <div id="cart-sidebar">
        <h2 class="section-title" style="font-size: 1rem;">CARRINHO</h2>
        <button onclick="toggleCart()" class="btn" style="border-color: #444; margin-bottom: 20px;">FECHAR</button>
        <div class="cart-items-list" id="cart-items"></div>
        <div style="border-top: 1px solid var(--accent); padding-top: 15px;">
            <p style="display: flex; justify-content: space-between;">TOTAL: <span id="cart-total" style="color: var(--accent); font-weight: bold;">R$ 0,00</span></p>
            <button onclick="irParaCheckout()" class="btn" style="margin-top: 15px; background: var(--accent); color: #000;">FINALIZAR COMPRA</button>
        </div>
    </div>

    <!-- SEÇÃO LOJA (PRODUTOS) -->
    <section id="loja">
        <h2 class="section-title">HARDWARE ELITE</h2>
        <div class="grid">
            <div class="card">
                <img src="https://http2.mlstatic.com/D_NQ_NP_2X_716038-MLU78929255715_092024-F.webp" class="product-img">
                <h3>RTX 3080 OC 10GB</h3>
                <span class="price">R$ 7.000,00</span>
                <button onclick="adicionarAoCarrinho('RTX 3080 OC', 7000.00)" class="btn">ADICIONAR</button>
            </div>
            <div class="card">
                <img src="https://http2.mlstatic.com/D_NQ_NP_2X_977430-MLA104860898285_012026-F.webp" class="product-img">
                <h3>TECLADO MECÂNICO RGB</h3>
                <span class="price">R$ 850,00</span>
                <button onclick="adicionarAoCarrinho('Teclado Mecânico RGB', 850.00)" class="btn">ADICIONAR</button>
            </div>
            <!-- ... demais produtos seguem a mesma lógica ... -->
        </div>
    </section>

    <!-- MODAL PAGAMENTO -->
    <div id="payment-modal">
        <div class="payment-content">
            <button onclick="fecharModal()" class="btn" style="margin-bottom:20px; width:auto;">← VOLTAR</button>
            <div id="email-step">
                <h3 style="font-size: 0.8rem; margin-bottom:10px; color:var(--accent);">E-MAIL PARA RECIBO:</h3>
                <input type="email" id="input-email-cliente" placeholder="seu@email.com">
                <button onclick="validarEIniciarCheckoutMP()" class="btn" style="background:var(--accent); color:#000;">PROSSEGUIR</button>
            </div>
            <div id="paymentBrick_container"></div>
        </div>
    </div>

    <script>
        const mp = new MercadoPago('APP_USR-75a7db7d-cf21-488b-afcc-c46d03085ded');
        let carrinho = JSON.parse(localStorage.getItem('techno_cart')) || [];

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }

        function adicionarAoCarrinho(nome, preco) {
            carrinho.push({ nome, preco });
            atualizarCarrinhoUI();
            alert(nome + " adicionado!");
        }

        function removerDoCarrinho(index) {
            carrinho.splice(index, 1);
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            localStorage.setItem('techno_cart', JSON.stringify(carrinho));
            const listEl = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            listEl.innerHTML = '';
            let total = 0;
            carrinho.forEach((item, index) => {
                total += item.preco;
                listEl.innerHTML += `<div class="cart-item"><div>${item.nome}<br>R$ ${item.preco.toFixed(2)}</div><button class="remove-btn" onclick="removerDoCarrinho(${index})">remover</button></div>`;
            });
            countEl.innerText = carrinho.length;
            totalEl.innerText = `R$ ${total.toFixed(2)}`;
        }

        function irParaCheckout() {
            if (carrinho.length === 0) return alert("Carrinho vazio!");
            toggleCart();
            document.getElementById('payment-modal').style.display = 'block';
        }

        function fecharModal() {
            document.getElementById('payment-modal').style.display = 'none';
            if (window.paymentBrickController) window.paymentBrickController.unmount();
        }

        async function validarEIniciarCheckoutMP() {
            const email = document.getElementById('input-email-cliente').value;
            if (!email.includes("@")) return alert("E-mail inválido");
            document.getElementById('email-step').style.display = 'none';
            const totalCompra = carrinho.reduce((acc, i) => acc + i.preco, 0);
            const resumo = carrinho.map(i => i.nome).join(', ');

            const bricksBuilder = mp.bricks();
            window.paymentBrickController = await bricksBuilder.create('payment', 'paymentBrick_container', {
                initialization: { amount: totalCompra, payer: { email } },
                customization: { paymentMethods: { ticket: "all", bankTransfer: "all", creditCard: "all" } },
                callbacks: {
                    onSubmit: ({ formData }) => {
                        return fetch("/api/finalizar", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ ...formData, produto: resumo, valor: totalCompra })
                        }).then(r => r.json()).then(res => {
                            if (res.status === 'approved') {
                                alert("Sucesso!");
                                carrinho = []; atualizarCarrinhoUI(); location.reload();
                            }
                        });
                    }
                }
            });
        }
        atualizarCarrinhoUI();
    </script>
</body>
</html>
